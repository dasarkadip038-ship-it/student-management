<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Data</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 35px 20px;
        }

        .container {
            max-width: 1250px;
            margin: auto;
        }

        .card {
            background: rgba(255, 255, 255, 0.97);
            border-radius: 22px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 20px;
        }

        .title-area h1 {
            color: #222;
            font-size: 32px;
            margin-bottom: 7px;
        }

        .title-area p {
            color: #777;
            font-size: 14px;
        }

        .add-btn {
            text-decoration: none;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 13px 20px;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.3s;
            white-space: nowrap;
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.35);
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            border-radius: 12px;
        }

        table {
            width: 100%;
            min-width: 850px;
            border-collapse: collapse;
            overflow: hidden;
        }

        thead {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        th {
            padding: 16px 12px;
            text-align: left;
            font-size: 14px;
            white-space: nowrap;
        }

        td {
            padding: 15px 12px;
            border-bottom: 1px solid #eee;
            color: #333;
            font-size: 14px;
        }

        tbody tr {
            transition: 0.2s;
        }

        tbody tr:hover {
            background: #f5f6ff;
        }

        .sl {
            font-weight: bold;
            color: #667eea;
        }

        .delete-btn {
            border: none;
            background: #e74c3c;
            color: white;
            padding: 8px 14px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .delete-btn:hover {
            background: #c0392b;
            transform: translateY(-1px);
        }

        .message {
            text-align: center;
            font-weight: bold;
            margin: 18px 0;
            min-height: 20px;
        }

        .success {
            color: #159957;
        }

        .error {
            color: #e63946;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 25px;
        }

        .page-btn {
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .page-btn:hover:not(:disabled) {
            background: #764ba2;
            transform: translateY(-1px);
        }

        .page-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        #pageInfo {
            font-weight: bold;
            color: #444;
            min-width: 100px;
            text-align: center;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        .total {
            margin-top: 20px;
            text-align: right;
            color: #666;
            font-size: 13px;
        }

        @media (max-width: 700px) {

            body {
                padding: 15px;
            }

            .card {
                padding: 20px 15px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .title-area h1 {
                font-size: 26px;
            }

            .add-btn {
                width: 100%;
                text-align: center;
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <div class="card">

            <div class="header">

                <div class="title-area">

                    <h1>📊 Student Data</h1>

                    <p>
                        All Registered Students
                    </p>

                </div>

                <a href="/form.html" class="add-btn">
                    ➕ Add Student
                </a>

            </div>

            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>SL</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Course</th>
                            <th>Semester</th>
                            <th>Action</th>

                        </tr>

                    </thead>

                    <tbody id="studentTable">

                    </tbody>

                </table>

            </div>

            <div id="message" class="message"></div>

            <div class="pagination">

                <button
                    id="prevBtn"
                    class="page-btn"
                    onclick="previousPage()">
                    ← Previous
                </button>

                <span id="pageInfo">
                    Page 1
                </span>

                <button
                    id="nextBtn"
                    class="page-btn"
                    onclick="nextPage()">
                    Next →
                </button>

            </div>

            <div class="total">
                Total Students:
                <strong id="totalStudents">0</strong>
            </div>

        </div>

    </div>

    <script>

        let currentPage = 1;
        const limit = 5;

        async function loadStudents() {

            try {

                const response = await fetch(
                    `/api/students?page=${currentPage}&limit=${limit}`
                );

                const data = await response.json();

                const table =
                    document.getElementById("studentTable");

                table.innerHTML = "";

                if (!data.students || data.students.length === 0) {

                    table.innerHTML = `
                        <tr>
                            <td colspan="7" class="empty">
                                No students found
                            </td>
                        </tr>
                    `;

                } else {

                    data.students.forEach((student, index) => {

                        const row = document.createElement("tr");

                        const serial =
                            ((currentPage - 1) * limit) +
                            index + 1;

                        row.innerHTML = `

                            <td class="sl">
                                ${serial}
                            </td>

                            <td>
                                ${student.name}
                            </td>

                            <td>
                                ${student.email}
                            </td>

                            <td>
                                ${student.phone}
                            </td>

                            <td>
                                ${student.course}
                            </td>

                            <td>
                                ${student.semester}
                            </td>

                            <td>
                                <button
                                    class="delete-btn"
                                    onclick="deleteStudent('${student._id}')">
                                    🗑 Delete
                                </button>
                            </td>

                        `;

                        table.appendChild(row);

                    });

                }

                document.getElementById("pageInfo").textContent =
                    `Page ${data.currentPage} of ${data.totalPages || 1}`;

                document.getElementById("totalStudents").textContent =
                    data.totalStudents;

                document.getElementById("prevBtn").disabled =
                    currentPage <= 1;

                document.getElementById("nextBtn").disabled =
                    currentPage >= data.totalPages;

            } catch (error) {

                console.error(error);

                showMessage(
                    "Failed to load student data",
                    "error"
                );

            }

        }

        async function deleteStudent(id) {

            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this student?"
                );

            if (!confirmDelete) {
                return;
            }

            try {

                const response = await fetch(
                    `/api/students/${id}`,
                    {
                        method: "DELETE"
                    }
                );

                const data = await response.json();

                if (response.ok) {

                    showMessage(
                        "✓ Student deleted successfully!",
                        "success"
                    );

                    const result =
                        await fetch(
                            `/api/students?page=${currentPage}&limit=${limit}`
                        );

                    const pageData =
                        await result.json();

                    if (
                        pageData.students.length === 0 &&
                        currentPage > 1
                    ) {
                        currentPage--;
                    }

                    loadStudents();

                } else {

                    showMessage(
                        data.message ||
                        "Failed to delete student",
                        "error"
                    );

                }

            } catch (error) {

                console.error(error);

                showMessage(
                    "Server connection failed",
                    "error"
                );

            }

        }

        function previousPage() {

            if (currentPage > 1) {

                currentPage--;

                loadStudents();

            }

        }

        function nextPage() {

            currentPage++;

            loadStudents();

        }

        function showMessage(text, type) {

            const message =
                document.getElementById("message");

            message.textContent = text;

            message.className =
                "message " + type;

            setTimeout(() => {

                message.textContent = "";

            }, 2500);

        }

        loadStudents();

    </script>

</body>

</html>
