<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .container {
            width: 100%;
            max-width: 560px;
        }

        .card {
            background: rgba(255, 255, 255, 0.97);
            padding: 35px;
            border-radius: 22px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
        }

        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 8px;
            font-size: 30px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 28px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
            background: #fafafa;
        }

        input:focus {
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.12);
        }

        button {
            width: 100%;
            border: none;
            padding: 15px;
            margin-top: 8px;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(102, 126, 234, 0.35);
        }

        button:active {
            transform: scale(0.98);
        }

        #message {
            text-align: center;
            margin-top: 18px;
            font-weight: bold;
            min-height: 20px;
        }

        .success {
            color: #159957;
        }

        .error {
            color: #e63946;
        }

        .view-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .view-link:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .footer {
            text-align: center;
            color: #777;
            font-size: 12px;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .card {
                padding: 25px 20px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <div class="icon">
                🎓
            </div>

            <h1>Student Registration</h1>

            <p class="subtitle">
                Add a new student to the management system
            </p>

            <form id="studentForm">

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter student name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter email address" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="Enter phone number" required>
                </div>

                <div class="form-group">
                    <label for="course">Course</label>
                    <input type="text" id="course" placeholder="Example: Diploma in CSE" required>
                </div>

                <div class="form-group">
                    <label for="semester">Semester</label>
                    <input type="text" id="semester" placeholder="Example: 5th" required>
                </div>

                <button type="submit">
                    ➕ Add Student
                </button>

            </form>

            <div id="message"></div>

            <a href="/data.html" class="view-link">
                📊 View All Students →
            </a>

        </div>

        <div class="footer">
            Student Management System • MongoDB + Express.js
        </div>

    </div>

    <script>
        const form = document.getElementById("studentForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", async function (event) {

            event.preventDefault();

            const studentData = {
                name: document.getElementById("name").value,
                email: document.getElementById("email").value,
                phone: document.getElementById("phone").value,
                course: document.getElementById("course").value,
                semester: document.getElementById("semester").value
            };

            try {

                const response = await fetch("/api/students", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(studentData)
                });

                const data = await response.json();

                if (response.ok) {

                    message.textContent = "✓ Student added successfully!";
                    message.className = "success";

                    form.reset();

                } else {

                    message.textContent =
                        "✕ " + (data.message || "Failed to add student");

                    message.className = "error";
                }

            } catch (error) {

                message.textContent = "✕ Server connection failed";
                message.className = "error";

            }

        });
    </script>

</body>

</html>
